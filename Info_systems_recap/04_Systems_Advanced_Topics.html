                section: 'advanced',
                category: 'System Design',
                question: 'A system\'s purpose may not be explicitly stated. It becomes clear through:',
                options: [
                    { text: 'Study of system boundaries', letter: 'A' },
                    { text: 'Analysis of system external environment', letter: 'B' },
                    { text: 'Observation of the system\'s actual operations', letter: 'C' },
                    { text: 'Counting the number of subsystems', letter: 'D' }
                ],
                correct: 'C',
                explanation: 'Actual operational behavior reveals true system purpose better than formal declarations.'
            },
            {
                id: 34,
                section: 'advanced',
                category: 'System Elements',
                question: 'Interconnections within a tree system include:',
                options: [
                    { text: 'Leaves and branches', letter: 'A' },
                    { text: 'Physical flows and chemical reactions among parts', letter: 'B' },
                    { text: 'Soil nutrients', letter: 'C' },
                    { text: 'Bark texture', letter: 'D' }
                ],
                correct: 'B',
                explanation: 'Tree interconnections include physical flows (water, nutrients) and chemical processes.'
            },
            {
                id: 35,
                section: 'advanced',
                category: 'Hierarchy Structure',
                question: 'Which statement best describes the relationship between systems, subsystems, and components?',
                options: [
                    { text: 'Subsystems exist independently of systems', letter: 'A' },
                    { text: 'Components are made up of subsystems', letter: 'B' },
                    { text: 'Systems decompose into subsystems, which further decompose into components', letter: 'C' },
                    { text: 'Components and subsystems are identical', letter: 'D' }
                ],
                correct: 'C',
                explanation: 'There\'s a hierarchy: Systems → Subsystems → Components, each level containing the one below.'
            }
        ];

        let userAnswers = {};
        let showAnswerMode = false;

        function displayQuestions() {
            const container = document.getElementById('questionsContainer');
            const filter = document.getElementById('sectionFilter').value;
            const filtered = filter === 'all' ? allQuestions : allQuestions.filter(q => q.section === filter);

            container.innerHTML = filtered.map(q => `
                <div class="question-card">
                    <div class="question-number">Question ${q.id} • ${q.category}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map(opt => `
                            <label class="option">
                                <input type="radio" name="q${q.id}" value="${opt.letter}" 
                                    onchange="selectAnswer(${q.id}, '${opt.letter}')"
                                    ${userAnswers[q.id] === opt.letter ? 'checked' : ''}>
                                <span><strong>${opt.letter})</strong> ${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                    ${showAnswerMode ? `
                        <div class="answer-feedback ${userAnswers[q.id] === q.correct ? 'correct-feedback' : 'incorrect-feedback'}">
                            <strong>Correct Answer: ${q.correct}</strong>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    ` : `
                        <button class="btn-secondary show-answer-btn" onclick="showAnswerFor(${q.id})">Show Answer</button>
                    `}
                </div>
            `).join('');

            updateStats();
        }

        function selectAnswer(questionId, answer) {
            userAnswers[questionId] = answer;
            updateStats();
            if (showAnswerMode) displayQuestions();
        }

        function showAnswerFor(questionId) {
            const q = allQuestions.find(q => q.id === questionId);
            if (!q) return;
            alert(`Correct Answer: ${q.correct}\n\n${q.explanation}`);
        }

        function toggleAnswerMode() {
            showAnswerMode = !showAnswerMode;
            displayQuestions();
        }

        function updateStats() {
            const answered = Object.keys(userAnswers).length;
            const correct = Object.entries(userAnswers).filter(([id, ans]) => {
                const q = allQuestions.find(q => q.id === parseInt(id));
                return q && q.correct === ans;
            }).length;
            const percentage = answered > 0 ? Math.round((correct / answered) * 100) : 0;

            document.getElementById('answered').textContent = answered;
            document.getElementById('correct').textContent = correct;
            document.getElementById('percentage').textContent = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${(answered / allQuestions.length) * 100}%`;
        }

        function resetQuiz() {
            if (confirm('Reset all answers? This cannot be undone.')) {
                userAnswers = {};
                displayQuestions();
                updateStats();
            }
        }

        document.getElementById('sectionFilter').addEventListener('change', displayQuestions);
        displayQuestions();
    </script>
</body>
</html>
