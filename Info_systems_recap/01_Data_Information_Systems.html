                question: 'Which of the following is an intangible element of a university system?',
                options: [
                    { text: 'Buildings', letter: 'A' },
                    { text: 'Computers', letter: 'B' },
                    { text: 'Academic expertise', letter: 'C' },
                    { text: 'Books', letter: 'D' }
                ],
                correct: 'C',
                explanation: 'Academic expertise is intangible knowledge; buildings, computers, and books are physical (tangible) elements.'
            },
            {
                id: 33,
                section: 'part-a',
                category: 'Systems Thinking',
                question: 'Systems thinking views problems as ________.',
                options: [
                    { text: 'isolated events only', letter: 'A' },
                    { text: 'parts of an overall system', letter: 'B' },
                    { text: 'unrelated data only', letter: 'C' },
                    { text: 'manual activities only', letter: 'D' }
                ],
                correct: 'B',
                explanation: 'Systems thinking recognizes that problems are interconnected and part of larger systems.'
            },
            {
                id: 34,
                section: 'part-a',
                category: 'Systems',
                question: 'A physical system has elements that are ________.',
                options: [
                    { text: 'tangible', letter: 'A' },
                    { text: 'purely conceptual', letter: 'B' },
                    { text: 'always invisible', letter: 'C' },
                    { text: 'only probabilistic', letter: 'D' }
                ],
                correct: 'A',
                explanation: 'Physical systems consist of tangible, material elements that can be observed or touched.'
            },
            {
                id: 35,
                section: 'part-a',
                category: 'Systems',
                question: 'Entropy refers to the amount of ________ in a system.',
                options: [
                    { text: 'order only', letter: 'A' },
                    { text: 'disorder or randomness', letter: 'B' },
                    { text: 'profit', letter: 'C' },
                    { text: 'knowledge conversion', letter: 'D' }
                ],
                correct: 'B',
                explanation: 'Entropy is the measure of disorder, randomness, or lack of organization in a system.'
            }
        ];

        let userAnswers = {};
        let showAnswerMode = false;

        function displayQuestions() {
            const container = document.getElementById('questionsContainer');
            const filter = document.getElementById('sectionFilter').value;
            const filtered = filter === 'all' ? allQuestions : allQuestions.filter(q => q.section === filter);

            container.innerHTML = filtered.map((q, idx) => `
                <div class="question-card">
                    <div class="question-number">Question ${q.id} • ${q.category}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map(opt => `
                            <label class="option">
                                <input type="radio" name="q${q.id}" value="${opt.letter}" 
                                    onchange="selectAnswer(${q.id}, '${opt.letter}')"
                                    ${userAnswers[q.id] === opt.letter ? 'checked' : ''}>
                                <span><strong>${opt.letter})</strong> ${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                    ${showAnswerMode ? `
                        <div class="answer-feedback ${userAnswers[q.id] === q.correct ? 'correct-feedback' : 'incorrect-feedback'}">
                            <strong>Correct Answer: ${q.correct}</strong>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    ` : `
                        <button class="btn-secondary show-answer-btn" onclick="showAnswerFor(${q.id})">Show Answer</button>
                    `}
                </div>
            `).join('');

            updateStats();
        }

        function selectAnswer(questionId, answer) {
            userAnswers[questionId] = answer;
            updateStats();
            if (showAnswerMode) displayQuestions();
        }

        function showAnswerFor(questionId) {
            const q = allQuestions.find(q => q.id === questionId);
            if (!q) return;
            
            const card = document.querySelector(`[data-question="${questionId}"]`);
            alert(`Correct Answer: ${q.correct}\n\n${q.explanation}`);
        }

        function toggleAnswerMode() {
            showAnswerMode = !showAnswerMode;
            displayQuestions();
        }

        function updateStats() {
            const answered = Object.keys(userAnswers).length;
            const correct = Object.entries(userAnswers).filter(([id, ans]) => {
                const q = allQuestions.find(q => q.id === parseInt(id));
                return q && q.correct === ans;
            }).length;
            const percentage = answered > 0 ? Math.round((correct / answered) * 100) : 0;

            document.getElementById('answered').textContent = answered;
            document.getElementById('correct').textContent = correct;
            document.getElementById('percentage').textContent = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${(answered / allQuestions.length) * 100}%`;
        }

        function resetQuiz() {
            if (confirm('Reset all answers? This cannot be undone.')) {
                userAnswers = {};
                displayQuestions();
                updateStats();
            }
        }

        document.getElementById('sectionFilter').addEventListener('change', displayQuestions);
        displayQuestions();
    </script>
</body>
</html>
